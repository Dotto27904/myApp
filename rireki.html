<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>読書ノート</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    .tab-button {
      padding: 10px 15px;
      margin: 4px;
      font-size: 18px;

      border: 1px solid #666;

    }

<body>

<div style="text-align:left; margin:10px;">
  <button onclick="location.href='index.html'"
          style="padding:10px 20px; font-size:16px;">
    ← 戻る
  </button>
</div>

<h2>読書ノート</h2>

<div id="description">
  読み取りボタンを押して、カメラで本のバーコードを読み込んでください。<br>
  読み込むバーコードは、本の裏面の２段のバーコードです。<br>
  上手く読み込めない場合は、手動で登録することも可能です。<br>
  よみは「ひらがな」「アルファベット」「数字」のみ入力できます。
</div>

<!-- 上段：ボタン -->
<div id="top-area" style="margin:20px; text-align:center;"></div>

<h3>タイトル別</h3>

<!-- タブ分類 -->
<div id="tabs" style="margin:20px; text-align:center;">
  <button class="tab-button" onclick="BooksManager.renderBookList(currentSort,'ア行')">あ行</button>
  <button class="tab-button" onclick="BooksManager.renderBookList(currentSort,'カ行')">か行</button>
  <button class="tab-button" onclick="BooksManager.renderBookList(currentSort,'サ行')">さ行</button>
  <button class="tab-button" onclick="BooksManager.renderBookList(currentSort,'タ行')">た行</button>
  <button class="tab-button" onclick="BooksManager.renderBookList(currentSort,'ナ行')">な行</button>
  <button class="tab-button" onclick="BooksManager.renderBookList(currentSort,'ハ行')">は行</button>
  <button class="tab-button" onclick="BooksManager.renderBookList(currentSort,'マ行')">ま行</button>
  <button class="tab-button" onclick="BooksManager.renderBookList(currentSort,'ヤ行')">や行</button>
  <button class="tab-button" onclick="BooksManager.renderBookList(currentSort,'ラ行')">ら行</button>
  <button class="tab-button" onclick="BooksManager.renderBookList(currentSort,'ワ行')">わ行</button>
  <button class="tab-button" onclick="BooksManager.renderBookList(currentSort,'英字')">英字</button>
  <button class="tab-button" onclick="BooksManager.renderBookList(currentSort,'数字')">数字</button>
  <button class="tab-button" onclick="BooksManager.renderBookList(currentSort,'その他')">その他</button>
</div>

<!-- ソートボタン -->
<div style="text-align:center; margin:10px;">
  <button onclick="BooksManager.renderBookList('yomi', currentGroup)">よみ順</button>
  <button onclick="BooksManager.renderBookList('title', currentGroup)">タイトル順</button>
  <button onclick="BooksManager.renderBookList('author', currentGroup)">著者順</button>
  <button onclick="BooksManager.renderBookList('created', currentGroup)">登録順</button>
</div>

<!-- 中段：読み取り終了ボタン -->
<div id="middle-area" style="margin:20px; text-align:center;"></div>

<!-- 下段：一覧 -->
<div id="bottom-area" style="margin:20px;">
  <h3>読んだ本一覧</h3>
  <div id="book-list"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script src="js/books.js"></script>

<script>
let currentSort = "yomi";
let currentGroup = "ア行";
let duplicateAlertShown = false;
let cameraStopped = false;
let lastCode = "";
let isProcessing = false;

/* -----------------------------------
   OpenBD
----------------------------------- */
async function fetchBookInfo(isbn) {
  try {
    const url = "https://api.openbd.jp/v1/get?isbn=" + isbn;
    const res = await fetch(url);
    const data = await res.json();

    if (!data || !data[0]) return null;

    const summary = data[0].summary;
    const title = summary.title || "";
    const author = summary.author || "";
    let yomi = summary.volume || "";

    if (!yomi) yomi = BooksManager.fallbackYomi(title);
    else yomi = BooksManager.normalizeYomi(yomi);

    return { isbn, title, author, yomi };
  } catch {
    return null;
  }
}

/* -----------------------------------
   ★ renderBookList のカード＋書影フォールバック版
----------------------------------- */
BooksManager.renderBookList = function(sortType = "yomi", group = null, topIsbn = null) {
    window.currentSort = sortType;
    if (group !== null) window.currentGroup = group;

    const allBooks = this.getBooks();
    let books = [...allBooks];

    books = books.filter(book =>
        this.getGroupFromYomi(book.yomi) === window.currentGroup
    );

    if (sortType === "title") {
        books.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
    } else if (sortType === "author") {
        books.sort((a, b) => (a.author || "").localeCompare(b.author || ""));
    } else if (sortType === "created") {
        // 登録順
    } else {
        books.sort((a, b) => (a.yomi || "").localeCompare(b.yomi || ""));
    }

    if (topIsbn) {
        const idx = books.findIndex(b => b.isbn === topIsbn);
        if (idx > -1) {
            const [target] = books.splice(idx, 1);
            books.unshift(target);
        }
    }

    const list = document.getElementById("book-list");
    list.innerHTML = "";

    books.forEach((book) => {
        const originalIndex = allBooks.findIndex(b => b.isbn === book.isbn);

        const div = document.createElement("div");
        div.className = "book-card";

        const openbdUrl = `https://cover.openbd.jp/${book.isbn}.jpg`;
        const ndlUrl = `https://ndlsearch.ndl.go.jp/thumbnail/ISBN/${book.isbn}`;

        div.innerHTML = `
            <div style="display:flex; gap:12px;">
                <img src="${openbdUrl}"
                     onerror="this.onerror=null; this.src='${ndlUrl}'; this.onerror=function(){ this.src='noimage.png'; };"
                     style="width:80px; height:110px; object-fit:cover; border-radius:6px;">
                
                <div style="flex:1;">
                    <div class="book-title">${book.title}</div>
                    <div class="book-meta">著者：${book.author}</div>
                    <div class="book-meta">よみ：${book.yomi}</div>
                    <div class="book-meta">ISBN：${book.isbn}</div>
                </div>
            </div>

            <div class="book-buttons">
                <button onclick="editBook(${originalIndex})">編集</button>
                <button onclick="BooksManager.confirmDelete(${originalIndex})">削除</button>
            </div>
        `;

        list.appendChild(div);
    });
};

/* -----------------------------------
   以下はあなたの元コードそのまま
----------------------------------- */

/* 初期ボタン描画 */
function drawTopButtons() {
  document.getElementById("description").innerHTML = `
  読み取りボタンを押して、カメラで本のバーコードを読み込んでください。<br>
  読み込むバーコードは、本の裏面の２段のバーコードです。<br>
  上手く読み込めない場合は、手動で登録することも可能です。<br>
  よみは「ひらがな」「アルファベット」「数字」のみ入力できます。
  `;
  const top = document.getElementById("top-area");
  top.innerHTML = "";

  const h3Register = document.createElement("h3");
  h3Register.textContent = "本の登録";
  top.appendChild(h3Register);

  const btn1 = document.createElement("button");
  btn1.textContent = "バーコード読み取り";
  btn1.style = "padding:10px 20px; font-size:18px;";
  btn1.onclick = showCamera;

  const btn2 = document.createElement("button");
  btn2.textContent = "手動登録";
  btn2.style = "padding:10px 20px; font-size:18px; margin-left:10px;";
  btn2.onclick = showManualEntryForm;

  top.appendChild(btn1);
  top.appendChild(btn2);

  const h3Backup = document.createElement("h3");
  h3Backup.textContent = "バックアップ";
  h3Backup.style = "margin-top:25px;";
  top.appendChild(h3Backup);

  const btn3 = document.createElement("button");
  btn3.textContent = "バックアップ作成";
  btn3.style = "padding:10px 20px; font-size:18px;";
  btn3.onclick = showBackupData;

  const btn4 = document.createElement("button");
  btn4.textContent = "復元";
  btn4.style = "padding:10px 20px; font-size:18px; margin-left:10px;";
  btn4.onclick = showRestoreTextUI;

  top.appendChild(btn3);
  top.appendChild(btn4);
}

/* 手動登録フォーム */
function showManualEntryForm() {
  const top = document.getElementById("top-area");
  top.innerHTML = `
    <h3>手動登録</h3>

    ISBN：<br>
    <input id="m-isbn" type="text"><br><br>

    タイトル：<br>
    <input id="m-title" type="text"><br><br>

    著者：<br>
    <input id="m-author" type="text"><br><br>

    よみ：<br>
    <input id="m-yomi" type="text"
           oninput="this.value = this.value.replace(/[^ぁ-んa-zA-Z0-9ー]/g, '');"><br><br>

    <button onclick="manualSave()">登録する</button>
    <button onclick="drawTopButtons()" style="margin-left:10px;">キャンセル</button>
  `;
}

function manualSave() {
  const info = {
    isbn: document.getElementById("m-isbn").value || ("temp_" + Date.now()),
    title: document.getElementById("m-title").value,
    author: document.getElementById("m-author").value,
    yomi: document.getElementById("m-yomi").value
  };

  if (!info.title || !info.yomi) {
    alert("タイトル・よみは必須です");
    return;
  }

  if (BooksManager.isDuplicate(info)) {
    alert("この本はすでに登録されています");
    drawTopButtons();
    return;
  }

  BooksManager.saveBook(info);

  const group = BooksManager.getGroupFromYomi(info.yomi);
  BooksManager.renderBookList("yomi", group, info.isbn);

  alert("登録しました");
  setTimeout(drawTopButtons, 10);
  document.getElementById("middle-area").innerHTML = "";
}

/* 編集 */
function editBook(index) {
  const books = BooksManager.getBooks();
  const book = books[index];

  const top = document.getElementById("top-area");
  top.innerHTML = `
    <h3>編集</h3>

    ISBN：<br>
    <input id="e-isbn" type="text" value="${book.isbn}"><br><br>

    タイトル：<br>
    <input id="e-title" type="text" value="${book.title}"><br><br>

    著者：<br>
    <input id="e-author" type="text" value="${book.author}"><br><br>

    よみ：<br>
    <input id="e-yomi" type="text" value="${book.yomi}"
           oninput="this.value = this.value.replace(/[^ぁ-んa-zA-Z0-9ー]/g, '');"><br><br>

    <button onclick="saveEdit(${index})">保存</button>
    <button onclick="drawTopButtons()" style="margin-left:10px;">キャンセル</button>
  `;
}

function saveEdit(index) {
  const info = {
    isbn: document.getElementById("e-isbn").value,
    title: document.getElementById("e-title").value,
    author: document.getElementById("e-author").value,
    yomi: document.getElementById("e-yomi").value
  };

  const ok = BooksManager.updateBook(index, info);

  if (!ok) {
    alert("同じ ISBN の本が既に登録されています");
    return;
  }

  const group = BooksManager.getGroupFromYomi(info.yomi);
  BooksManager.renderBookList("yomi", group);

  alert("更新しました");
  drawTopButtons();
}

/* バックアップ（文字列） */
function showBackupData() {
  document.getElementById("description").innerHTML = `
    以下に表示される文字列をコピーして保存しておくことで、
    データが消えた際のバックアップとして利用することができます。<br>
    また、メール等で送ることで、他の端末にデータをコピーすることができます。
  `;

  const top = document.getElementById("top-area");
  const backupStr = BooksManager.exportBackupString();

  top.innerHTML = `
    <h3>バックアップ（文字列）</h3>
    <textarea id="backup-view" style="width:90%; height:150px;">${backupStr}</textarea><br><br>
    <button onclick="copyBackup()">コピー</button>
    <button onclick="drawTopButtons()" style="margin-left:10px;">戻る</button>
  `;
}

function copyBackup() {
  const text = document.getElementById("backup-view").value;

  navigator.clipboard.writeText(text)
    .then(() => {
      alert("バックアップデータをコピーしました。\nメール本文などに貼り付けて使えます。");
    })
    .catch(() => {
      alert("コピーに失敗しました。テキストを選択して手動でコピーしてください。");
    });
}

/* バックアップ復元 */
function showRestoreTextUI() {
  document.getElementById("description").innerHTML = `
    スマホを変えた際や、データが消えた際に、
    バックアップデータを貼り付けることで、データを復元することができます。
  `;

  const top = document.getElementById("top-area");

  top.innerHTML = `
    <h3>バックアップ復元（文字列）</h3>

    バックアップ文字列を貼り付けてください：<br>
    <textarea id="restore-text" style="width:90%; height:120px;"></textarea><br><br>

    <button onclick="restoreBackupFromText()">復元する</button>
    <button onclick="drawTopButtons()" style="margin-left:10px;">戻る</button>
  `;
}

function restoreBackupFromText() {
  const str = document.getElementById("restore-text").value.trim();

  if (!str) {
    alert("文字列が空です");
    return;
  }

  if (!confirm("本当にバックアップを保存したときの状態に戻しても良いですか？")) {
    return;
  }

  const ok = BooksManager.importBackupString(str);

  if (ok) {
    alert("復元しました");
    BooksManager.renderBookList(currentSort, currentGroup);
    drawTopButtons();
  } else {
    alert("復元に失敗しました（文字列が壊れている可能性があります）");
}
}
