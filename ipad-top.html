<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest-map.json">
<title>iPadトップ画面</title>
<style>
    /* 画像を横幅いっぱいに表示 */
    .full-width-img {
        width: 100%;       /* 横幅100% */
        height: auto;      /* アスペクト比を維持 */
        display: block;    /* 余計な隙間をなくす */
        border: none;      /* 枠線なし */
    }

    /* クリック時の視覚効果（任意） */
    .full-width-img:hover {
        opacity: 0.85;
        cursor: pointer;
        transition: opacity 0.3s ease;
    }
</style>
</head>
<body>

<!-- 画像をクリックで指定HTMLへ遷移 -->
<a href="map-ipad.html">
    <img src="ipad-top.jpg" alt="マップ" class="full-width-img">
</a>

</body>
</html>
